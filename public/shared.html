<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Christmas Wishlist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&family=Mountains+of+Christmas:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="/santa.png">
    <link rel="stylesheet" href="/index.css">
    <script type="module" src="/shared.js"></script>
</head>
<body class="bg-christmas text-light">
<header class="py-5 text-center">
    <div class="container">
        <h1 id="title" class="hero-title title mb-2">A Christmas Wishlist</h1>
        <p class="lead text mb-0">Shared with you from the family Secret Santa.</p>
    </div>
    <div class="snow" aria-hidden="true"></div>
    <div class="snow snow--2" aria-hidden="true"></div>
</header>

<main class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-9 col-lg-6">
            <section id="list" class="wish-card">
                <p id="status" class="mb-0" role="status">Unwrapping the list…</p>
            </section>
            <p class="text-center mt-4 small">
                <a class="link-light" href="/account">Family member? Sign in to add your own list.</a>
            </p>
        </div>
    </div>
</main>

<footer class="py-5 text-center small text-muted">
    <div class="container">
        <span>Made with love, cocoa, and a pinch of Christmas magic.</span>
    </div>
</footer>
</body>
</html>
